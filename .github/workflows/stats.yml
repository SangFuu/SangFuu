name: Actualiser les statistiques
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/stats.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les cartes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Enregistrer les cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if ! git diff --staged --quiet; then
            git commit -m "Actualisation des statistiques GitHub"
            git pull --rebase origin main
            git push
          fi
