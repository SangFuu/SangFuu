<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Selected projects</title>
<desc id="desc">Four restrained project plates representing Tower Defense, a Logo interpreter, a local security checker and a real-estate database.</desc>
<style>
  .bg{fill:#0f172a}.panel{fill:#111c2f;stroke:#334155;stroke-width:2}.accent{fill:#ffa500}.line{fill:none;stroke:#ffa500;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#64748b;stroke-width:2}.label{font:700 17px 'JetBrains Mono',ui-monospace,monospace;fill:#f8fafc;letter-spacing:1px}.meta{font:13px 'JetBrains Mono',ui-monospace,monospace;fill:#94a3b8}.num{font:700 12px 'JetBrains Mono',ui-monospace,monospace;fill:#ffa500}
</style>
