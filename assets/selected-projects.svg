<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Selected projects — technical index</title>
<desc id="desc">An asymmetric editorial grid showing four real software projects through functional diagrams.</desc>
<style>
.t{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'JetBrains Mono',Consolas,monospace}.white{fill:#f8fafc}.ink{fill:#0b1220}.muted{fill:#94a3b8}.hair{fill:none;stroke:#e2e8f0;stroke-width:2}.darkhair{fill:none;stroke:#0b1220;stroke-width:2}.bold{font-weight:700}.caps{letter-spacing:1.5px}.diagram{fill:none;stroke:#f8fafc;stroke-width:5;stroke-linecap:square;stroke-linejoin:miter}
</style>
<rect width="1100" height="520" rx="16" fill="#0b1220"/>
<text x="32" y="38" class="t white bold caps" font-size="16">PROJECT INDEX</text>
<text x="1068" y="38" text-anchor="end" class="mono muted" font-size="12">SANGFUU / 2026</text>
<line x1="32" y1="55" x2="1068" y2="55" stroke="#334155" stroke-width="2"/>

<!-- 01 / Tower Defense: dominant plate -->
